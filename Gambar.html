<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gambar</title>
  <style>
    /* SEARCH NAVBAR */
    .search {
      flex: 1;
      max-width: 910px;
      margin: 0 28px;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 54px;
      padding: 0 22px 0 58px;
      border: 1px solid rgba(148, 163, 184, .08);
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      font-weight: 500;
      color: #e5e7eb;
      background: #111820;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.015);
      transition: .25s ease;
    }

    .search input::placeholder {
      color: #aeb8c7;
      opacity: 1;
    }

    .search input:focus {
      border-color: rgba(0, 198, 255, .35);
      box-shadow: 0 0 0 3px rgba(0, 198, 255, .08);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 23px;
      height: 23px;
      transform: translateY(-50%);
      color: #b8c2d1;
      pointer-events: none;
    }

    .search-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      }

    /* NAVBAR */
    .navbar{
      position:sticky;
      top:0;
      z-index:1000;
      width:100%;
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
      box-sizing:border-box;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
      border-bottom:1px solid rgba(0,0,0,.08);
      transition:.3s ease
    }
    
    .nav-logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:20px;
      font-weight:800;
      color:#172033
    }
    
    .logo-icon{
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      border-radius:12px;
      background:linear-gradient(135deg,#4facfe,#00c6ff);
      box-shadow:0 5px 15px rgba(0,150,255,.25);
      overflow:hidden;
      flex-shrink:0;
    }

    .logo-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:12px;
    }

    .nav-actions{
      position:relative;
      display:flex;
      align-items:center;
      gap:8px
    }
    
    .theme-btn,.menu-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
      background:#f1f5f9;
      transition:.25s ease
    }
    
    .menu-btn{
      font-size:25px;
      line-height:1;
      color:#172033
    }
    
    .theme-btn:hover,.menu-btn:hover{
      transform:scale(1.08);
      background:#e5edf5
    }
    
    .hamburger-menu{
      display:none;
      position:absolute;
      top:52px;
      right:0;
      width:190px;
      padding:8px;
      background:rgba(255,255,255,.98);
      border:1px solid #e5eaf1;
      border-radius:16px;
      box-shadow:0 12px 30px rgba(20,35,60,.16);
      animation:menuSlide .18s ease
    }
    
    .hamburger-menu.show{
      display:block
    }
    
    .hamburger-menu a{
      display:block;
      padding:12px 14px;
      border-radius:11px;
      text-decoration:none;
      color:#172033;
      font-size:15px;
      font-weight:600;
      transition:.2s ease
    }
    
    .hamburger-menu a:hover{
      background:#eef8ff;
      color:#2196f3
    }
    
    @keyframes menuSlide{
      from{opacity:0;
           transform:translateY(-7px)
          }to{
        opacity:1;
        transform:translateY(0)
      }}

    /* =========================
       DARK MODE
    ========================= */

    body.dark-mode {
        background: #0f172a;
        color: #e5e7eb;
    }

    body.dark-mode .navbar {
        background: rgba(15, 23, 42, 0.88);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    body.dark-mode .nav-logo {
        color: #f8fafc;
    }

    body.dark-mode .nav-menu a {
        color: #cbd5e1;
    }

    body.dark-mode .nav-menu a:hover {
        color: #60a5fa;
        background: rgba(96, 165, 250, 0.12);
    }

    body.dark-mode .theme-btn {
        background: #1e293b;
    }

    body.dark-mode .menu-btn{
        background:#1e293b;
        color:#f8fafc
    }

    body:not(.dark-mode) .search input {
        color: #172033;
        background: #f1f5f9;
        border-color: #e2e8f0;
    }

    body:not(.dark-mode) .search input::placeholder {
        color: #64748b;
    }

    body:not(.dark-mode) .search-icon {
        color: #64748b;
    }
    
    body.dark-mode .hamburger-menu{
        background:rgba(15,23,42,.98);
        border-color:rgba(255,255,255,.08)
    }
    
    body.dark-mode .hamburger-menu a{
        color:#cbd5e1
    }
    
    body.dark-mode .hamburger-menu a:hover{
        color:#60a5fa;
        background:rgba(96,165,250,.12)
    }

    /* =========================
       HP / MOBILE
    ========================= */

    @media (max-width: 600px) {

    .navbar {
        height: 62px;
        padding: 0 15px;
    }

    .nav-logo {
        font-size: 16px;
    }

    .logo-icon {
        width: 36px;
        height: 36px;
        font-size: 19px;
    }

    .logo-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .hamburger-menu { display: none; }

    .search {
        margin: 0 12px;
        max-width: none;
    }

    .search input {
        height: 44px;
        padding-left: 46px;
        font-size: 14px;
        border-radius: 11px;
    }

    .search-icon {
        left: 15px;
        width: 20px;
        height: 20px;
    }

    .theme-btn, .menu-btn { width: 38px; height: 38px; }
    .menu-btn { font-size: 23px; }
    .hamburger-menu { top: 48px; width: 180px; }
}

    /* WhatsApp Floating Button */
    .whatsapp-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0,0,0,.22);
      z-index: 9999;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .whatsapp-float:hover {
      transform: scale(1.08);
      box-shadow: 0 9px 24px rgba(0,0,0,.28);
    }

    .whatsapp-float:active {
      transform: scale(.94);
    }

    .whatsapp-float svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    @media (max-width: 480px) {
      .container { padding: 14px; }
      header h1 { font-size: 26px; }
      .card { border-radius: 17px; }
      .app-image { width: 180px; }
    }
    

    /* =========================
       VIDEO RESPONSIVE
       ========================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .media-box {
      width: 100%;
      max-width: 900px;
      margin: 18px auto;
      padding: 0 12px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-box video {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      max-height: calc(100vh - 100px);
      margin: 0 auto;
      object-fit: contain;
      border-radius: 14px;
      background: #000;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {
      .media-box {
        width: 100%;
        margin: 10px auto;
        padding: 0 8px;
      }

      .media-box video {
        width: 100%;
        max-width: 100%;
        max-height: calc(100vh - 82px);
        border-radius: 10px;
      }
    }

    @media (max-width: 380px) {
      .media-box {
        padding: 0 6px;
      }

      .media-box video {
        border-radius: 8px;
      }
    }


    /* FOTO SAMA UKURANNYA DENGAN VIDEO */
      .media-box img {
        display:block;
        width:100%;
        max-width:720px;
        height:auto;
        max-height:calc(100vh - 100px);
        margin:0 auto;
        object-fit:contain;
        border-radius:14px;
        box-sizing:border-box; 
      }
      @media (max-width:600px){
      .media-box img{
        width:100%;
        max-width:100%;
        max-height:calc(100vh - 82px);
        border-radius:10px;
      }}
      @media (max-width:380px){
      .media-box img{
        border-radius:8px;
      }}

  </style>
</head>

    <div class="search">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16 16L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

      </span>
      <input id="search" type="search" placeholder="Cari aplikasi..." autocomplete="off" aria-label="Cari aplikasi">

        🌙

        ☰

<script>
  const themeToggle=document.getElementById("themeToggle"),
    menuToggle=document.getElementById("menuToggle"),
    hamburgerMenu=document.getElementById("hamburgerMenu");
  themeToggle.addEventListener("click",()=>{
    document.body.classList.toggle("dark-mode");
  const dark=document.body.classList.contains("dark-mode");
    themeToggle.textContent=dark?"☀️":"🌙";
    localStorage.setItem("theme",dark?"dark":"light")});
  if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark-mode");
    themeToggle.textContent="☀️"
  }
  menuToggle.addEventListener("click",e=>{
    e.stopPropagation();
    const open=hamburgerMenu.classList.toggle("show");
    menuToggle.setAttribute("aria-expanded",open);
    menuToggle.textContent=open?"✕":"☰"});
  hamburgerMenu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    hamburgerMenu.classList.remove("show");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.textContent="☰"}));
  document.addEventListener("click",e=>{if(!hamburgerMenu.contains(e.target)&&!menuToggle.contains(e.target)){
    hamburgerMenu.classList.remove("show");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.textContent="☰"}});
  const search=document.getElementById("search"),cards=document.querySelectorAll(".card"),empty=document.getElementById("empty");search.addEventListener("input",function(){const keyword=this.value.toLowerCase().trim();let visible=0;cards.forEach(card=>{const show=card.dataset.name.toLowerCase().includes(keyword);card.style.display=show?"":"none";if(show)visible++});empty.style.display=visible===0?"block":"none"});
</script>
