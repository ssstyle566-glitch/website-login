
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="login-box">

            <h1>Welcome!</h1>
            <p class="subtitle">Silakan masuk atau buat akun</p>

            <div class="tabs">
                <button id="loginTab" class="active">
                    Login
                </button>
                <button id="registerTab">
                    Register
                </button>
            </div>

            <form id="loginForm">
                <h2>Login Akun</h2>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="submit-btn">
                    Login
                </button>
            </form>

            <form id="registerForm" hidden>
                <h2>Buat Akun</h2>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Buat Username"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Buat Password"
                    minlength="8"
                    required
                >

                <button type="submit" class="submit-btn">
                    Daftar Sekarang
                </button>
            </form>

            <p id="message"></p>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
